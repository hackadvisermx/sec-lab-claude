# =============================================================================
# SecLab — publicación de los servicios del escritorio
# =============================================================================
# Este override lo aplica el CLI sólo cuando el perfil trae escritorio
# (`desktop`, `full`, `full-msf`). No se edita a mano y no hace falta pasarlo:
# `seclab start` lo añade solo.
#
# ¿Por qué un archivo aparte? Compose no puede publicar un puerto «si el
# servicio está activo». Publicar los tres siempre significaría, en el perfil
# `lite`, ocupar tres puertos del portátil del alumno para nada y anunciar
# endpoints que no responden.
#
# Todo se publica en 127.0.0.1 salvo que SECLAB_BIND diga otra cosa, que es un
# cambio consciente y que la revisión de seguridad marca.
# =============================================================================

services:
  lab:
    ports:
      # Escritorio XFCE en el navegador (noVNC → Xvnc en el 5901 interno, que
      # no se publica: sólo websockify llega a él).
      - "${SECLAB_BIND:-127.0.0.1}:${SECLAB_PUERTO_NOVNC:-6080}:6080"
      # code-server sobre /workspace.
      - "${SECLAB_BIND:-127.0.0.1}:${SECLAB_PUERTO_CODE:-8443}:8443"
      # Página de bienvenida: la que abre `seclab open`.
      - "${SECLAB_BIND:-127.0.0.1}:${SECLAB_PUERTO_WEB:-8080}:8080"
