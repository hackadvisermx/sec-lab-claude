# SecLab — preferencias de GTK 3 para la sesión del escritorio
#
# `gtk-application-prefer-dark-theme` es lo que de verdad pone el escritorio en
# oscuro. El «modo oscuro» del panel de XFCE no basta por sí solo, y GTK 3 no
# entiende un tema llamado «Adwaita-dark»: al ponerlo, cae al claro sin avisar.
#
# Esto no impide cambiar de tema desde Configuración → Apariencia: si eliges
# otro, manda el tuyo.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-font-name=Sans 10
