# SecLab — política de SSH
#
# Sólo por llave. Sin root. Sin contraseñas. Estas tres líneas son la razón de
# que este archivo exista; el resto son consecuencias.

PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes

AuthenticationMethods publickey

# El laboratorio se usa desde el host; no hace falta reenviar nada hacia fuera.
X11Forwarding no
AllowAgentForwarding no
PrintMotd no

# Cierra sesiones colgadas en lugar de acumularlas.
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30
MaxAuthTries 3
